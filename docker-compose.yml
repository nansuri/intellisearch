services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      PORT: "8088"
      DB_DRIVER: postgres
      DB_HOST: postgres
      REDIS_ADDR: redis:6379
      SEARXNG_BASE_URL: http://searxng:8080
      CRAWLER_BASE_URL: http://crawler:3002
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
      crawler:
        condition: service_started

  frontend:
    image: node:22-alpine
    working_dir: /app
    env_file: [.env]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${DB_USER:-aimain}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-aimain}"
      POSTGRES_DB: "${DB_NAME:-aimain}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-aimain} -d $${DB_NAME:-aimain}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile

volumes:
  pg_data:
  redis_data:
  frontend_node_modules:
