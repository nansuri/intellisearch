services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # ${ENV_FILE:-.env} lets deploy-prod.sh inject the production env file
    # (--env-file .env.production) instead of always loading the dev .env.
    env_file: ["${ENV_FILE:-.env}"]
    environment:
      PORT: "8088"
      DB_DRIVER: postgres
      REDIS_ADDR: redis:6379
      SEARXNG_BASE_URL: http://searxng:8080
      CRAWLER_BASE_URL: http://crawler:3002
      UPLOADS_DIR: /uploads
    volumes:
      # Uploaded logos/avatars persist across redeploys (the image pre-creates
      # /uploads owned by the nonroot user; the named volume inherits it).
      - uploads:/uploads
    ports:
      - "8088:8088"
    depends_on:
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
      crawler:
        condition: service_started
    # PostgreSQL and Ollama are NOT deployed here — this service attaches to
    # the existing shared DB network and the existing Ollama (Open WebUI)
    # network, exactly like just-ip-service does.
    networks:
      - default
      - shared_db
      - ollama

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    restart: unless-stopped

networks:
  shared_db:
    external: true
    name: "${SHARED_DB_NETWORK}"
  ollama:
    external: true
    name: "${OLLAMA_NETWORK:-open-webui_default}"

volumes:
  redis_data:
  uploads:
