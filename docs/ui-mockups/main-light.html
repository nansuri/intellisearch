<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="mockup.css" />
  <title>Intellisearch — Main page (light)</title>
</head>
<body>
  <main class="page-shell main-page">
    <div class="header-bar header-bar--sticky">
      <header class="app-header">
        <a class="brand-link" href="#">
          <span class="brand-mark">IN</span>
          <span class="brand-copy"><span class="site-name">Intellisearch</span><span class="brand-caption">Research, distilled</span></span>
        </a>
        <div class="header-actions">
          <span class="avatar">JD</span>
        </div>
      </header>
    </div>
    <section class="hero">
      <div class="hero-brand"><h1>Intellisearch</h1></div>
      <div class="ask-box">
        <form class="ask-form">
          <input placeholder="Ask a question, explore an idea…" value="" />
          <button class="base-button button-primary" type="button">Ask AI</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
